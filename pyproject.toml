[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "expensely"
version = "2020.1"
description = "Expensely expense management"
readme = "README.rst"
repository = "https://github.com/inducer/expensely"
license = "MIT"
authors = [{ name = "Andreas Kloeckner", email = "inform@tiker.net" }]
packages = [
    { include = "expenses" },
    { include = "expensely" },
]
requires-python = ">=3.10"

dependencies = [
    "django>=5.2.15",
    # Automatically renders Django forms in a pretty, Bootstrap-compatible way.
    "django-crispy-forms>=2.3",
    "crispy-bootstrap3>=2024.1",
    "pytz>=2020.1",
    # A date picker widget - https://github.com/tutorcruncher/django-bootstrap3-datetimepicker
    "django-bootstrap3-datetimepicker-2>=2.8.2",
    "granian>=2.6.1,<3",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "django-types",
]
[project.optional-dependencies]
postgres = [
    "psycopg2>=2.9.10,<3"
]

[tool.ruff]
preview = true
target-version = "py310"

[tool.ruff.lint]
extend-select = [
    "B",   # flake8-bugbear
    "C",   # flake8-comprehensions
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # flake8-isort
    "N",   # pep8-naming
    "NPY", # numpy
    "Q",   # flake8-quotes
    "W",   # pycodestyle
    "RUF",
    "UP",
    # "DJ",
]

extend-ignore = [
    "C90",  # McCabe complexity
    "multiple-spaces-before-operator",
    "missing-whitespace-around-arithmetic-operator",
    "multiple-spaces-after-comma",
    "tab-after-comma",
    "module-import-not-at-top-of-file",
    "error-suffix-on-exception-name",
    "non-empty-init-module",

    # TODO
    "raise-without-from-inside-except",
    "no-explicit-stacklevel",
    "mutable-class-default",
    "printf-string-formatting",
]
allowed-confusables = ["‐", "–"]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "double"
multiline-quotes = "double"

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
# mostly generated
"*/migrations/*.py" = ["Q", "line-too-long", "mutable-class-default", "unused-import", "missing-required-import", "UP"]
